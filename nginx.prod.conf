# nginx.prod.conf — EduRAG 生產環境（單一 nginx：前端靜態 + 後端 API 同源）
#
# 掛載方式：docker-compose.prod.yml 將本檔掛到 frontend 服務的
#   /etc/nginx/conf.d/default.conf（覆蓋映像內建的 nginx.conf）。
#   因此本檔是「server block」（沿用 base image 既有的 http{} 外層），
#   不要在此加 events{}/http{} 外層。
#
# HTTP-first：先以 80 埠上線，不含 TLS 憑證。
# TLS(443) 樣板見檔尾，補上憑證後解除註解即可啟用。

server {
    listen 80;
    server_name _;

    # 前端靜態檔（Vue SPA，history 模式：找不到檔案 fallback 到 index.html）
    root /usr/share/nginx/html;
    index index.html;

    # 上傳大檔（Excel / 圖片）放寬 body 上限，避免 413
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 後端 API 同源反向代理。
    # 後端對外實際有三組頂層前綴（見 backend/app/main.py 與各 router）：
    #   /api/*      —— 絕大多數 RESTful 資源
    #   /templates* —— 歷史遺留例外（frontend templateService.js 直打 /templates，無 /api 前綴）
    #   /health     —— 健康檢查（frontend questionService.js 會呼叫）
    # 三者都必須代理到 backend，否則會被上面的 location / 當成前端路由回傳 index.html。
    location ~ ^/(api|templates|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

