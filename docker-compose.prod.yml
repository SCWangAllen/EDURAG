# docker-compose.prod.yml
# 生產環境配置 - 適合部署到 GCP VM
# 使用方式: docker-compose -f docker-compose.prod.yml up -d

services:
  # ============================================
  # PostgreSQL + pgvector 資料庫
  # ============================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: edurag_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 生產環境優化參數
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      # 只綁 127.0.0.1:資料庫不對外
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 使用完整的初始化腳本
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edurag_user} -d ${POSTGRES_DB:-edurag}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - edurag_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 後端 API 服務 (使用現有的 Dockerfile)
  # ============================================
  backend:
    build: ./backend
    image: edurag-backend:prod
    container_name: edurag_backend
    restart: always
    environment:
      # 資料庫連線
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edurag_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edurag}

      # API 模式
      USE_MOCK_API: ${USE_MOCK_API:-false}

      # LLM 設定（本專案僅用 Anthropic；provider 已於 config.py 硬編）
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # CORS 設定 (根據您的域名調整)
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # 日誌等級
      LOG_LEVEL: INFO
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - ./data/images/questions:/app/data/images/questions:ro
      - ./data/images/answers:/app/data/images/answers:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edurag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 生產環境使用多 worker
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  # ============================================
  # 前端服務 (使用現有的 Dockerfile)
  # ============================================
  # 前端 nginx 同時擔任反向代理（靜態 + /api、/templates、/health 同源代理到 backend）
  frontend:
    build:
      context: ./frontend
      args:
        # 生產同源：前端 build 時將 API base URL 設為 '/'（走 nginx 反代）。
        # 用 '/' 而非空字串：Docker build-arg 無法區分「未傳入」與「傳入空字串」，
        # 空字串會誤讓 dev build 也判為同源；'/' 為非空可安全區分（見 frontend/src/api/axios.js）。
        VITE_API_BASE_URL: "/"
    image: edurag-frontend:prod
    container_name: edurag_frontend
    restart: always
    ports:
      # 前端即對外入口（80）。啟用 HTTPS 時再依 nginx.prod.conf 檔尾說明加回 443。
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    volumes:
      # 以生產設定覆蓋映像內建的 nginx.conf（server block，掛在 conf.d/default.conf）
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edurag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# 持久化 Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

# ============================================
# 網路配置
# ============================================
networks:
  edurag_network:
    driver: bridge